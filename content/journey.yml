intro: My interest in cellular heterogeneity grew through work on perturbation prediction and single-cell genetic regulation.
transition: {from: Prediction, to: Inference}
vision:
  stages: [Genotype, Regulatory dynamics, Cellular state, Complex traits]
  statement: I want to understand when, where, and how genetic regulation acts across heterogeneous cellular states.
chapters:
  - title: Applying computation to biomedical questions
    context: NYU Shanghai · Data Science / Artificial Intelligence
    text: A physics-informed model for the Buckley-Leverett equation introduced me to scientific modeling. Later, radiology report summarization and chest X-ray analysis showed me how computational methods could address biomedical questions.
  - title: Testing predictions on unseen perturbations
    context: Gerstein Lab · Yale · August 2025
    text: I began at Yale by evaluating CellForge-generated models on six single-cell datasets, holding out entire perturbations to test generalization. Differences between genetic and drug perturbation settings drew me toward cellular heterogeneity and questions in single-cell genetics.
  - title: Genetic effects along cellular continua
    context: Gerstein Lab · Yale · Single-cell statistical genetics
    text: In scPME-QTL, I modeled raw single-cell counts to test genetic effects along continuous cellular states. The project took me through methodological research, from deriving an efficient test to analyzing large-scale data and interpreting state-dependent regulatory effects.
  - title: Cellular context through genetic responses
    context: Statistical Functional Genomics Lab · Columbia · August 2026
    text: Working with Gao Wang, I built a single-cell simulation framework to test whether recurrent genetic-effect patterns can reveal cellular context. The project extends my interest in how effects vary across states to how genetic regulation can help define those states.
