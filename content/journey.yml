intro: My path into computational biology has been shaped by a recurring concern about what a model lets us conclude.
chapters:
  - title: From prediction to interpretation
    context: NYU Shanghai · Data Science / Artificial Intelligence
    text: In radiology summarization and image classification, I saw how strong predictive scores could coexist with factual errors or uncertain clinical meaning. Disease-entity evaluation and model visualization made me look more closely at the evidence behind a prediction.
  - title: Giving models scientific structure
    context: Statistical modeling & scientific machine learning
    text: Working on a physics-informed neural network for the Buckley–Leverett equation brought physical constraints into the learning problem. I became more interested in how assumptions and structure support scientific interpretation.
  - title: Taking cellular variation seriously
    context: Yale · Biostatistics & computational biology · Gerstein Lab
    text: Single-cell statistical genetics gave that concern a biological focus. Developing scPME-QTL took me from model derivation and calibration to questions about how genetic regulation changes along cellular continua.
  - title: Asking what remains uncertain
    context: Columbia collaboration · Context-dependent regulation · Cellular dynamics
    text: Regulotype, RNA velocity, and perturbation modeling now connect my interests in latent cellular states, genetic responses, and dynamics. I want to carry uncertainty in those inferred states into the biological conclusions we draw.
